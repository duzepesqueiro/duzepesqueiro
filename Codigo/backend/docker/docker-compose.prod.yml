services:
  postgres:
    image: postgres:16-alpine
    container_name: duzepesqueiro-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-duzepesqueiro}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-duzepesqueiro}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      duzepesqueiro-network:
        aliases:
          - api
          - duzepesqueiro-api

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: duzepesqueiro-api-prod
    restart: unless-stopped
    ports:
      - "8080:3000"

    environment:
      NODE_ENV: production
      PORT: 3000
      RUN_PRISMA_SEED: "true"

    env_file:
      - ../.env.production

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - duzepesqueiro-network

volumes:
  postgres_data_prod:

networks:
  duzepesqueiro-network:
    driver: bridge
