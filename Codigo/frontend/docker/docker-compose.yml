# Development-only compose file. Do not use in production/ECS.
services:
  auth:
    build:
      context: ../auth
      dockerfile: ../docker/Dockerfile.auth
    container_name: frontend-auth
    environment:
      VITE_BASE_PATH: /auth/
      VITE_USER_APP_URL: /user/
      VITE_ADMIN_APP_URL: /admin/
      VITE_API_BASE_URL: /api
    volumes:
      - ../auth:/app
      - auth_node_modules:/app/node_modules
    networks:
      - duzepesqueiro-network

  user:
    build:
      context: ../user
      dockerfile: ../docker/Dockerfile.user
    container_name: frontend-user
    environment:
      VITE_BASE_PATH: /user/
      VITE_AUTH_APP_URL: /auth/
      VITE_API_BASE_URL: /api
    volumes:
      - ../user:/app
      - user_node_modules:/app/node_modules
    networks:
      - duzepesqueiro-network

  administrator:
    build:
      context: ../administrator
      dockerfile: ../docker/Dockerfile.administrator
    container_name: frontend-administrator
    environment:
      VITE_BASE_PATH: /admin/
      VITE_API_BASE_URL: /api
    command: sh -c "if [ ! -d node_modules/socket.io-client ]; then npm install; fi && npm run dev -- --host 0.0.0.0 --port 4028 --strictPort"
    volumes:
      - ../administrator:/app
      - administrator_node_modules:/app/node_modules
    networks:
      - duzepesqueiro-network

  proxy:
    image: nginx:1.27-alpine
    container_name: frontend-proxy
    ports:
      - "80:80"
    depends_on:
      - auth
      - user
      - administrator
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - duzepesqueiro-network

volumes:
  auth_node_modules:
  user_node_modules:
  administrator_node_modules:

networks:
  duzepesqueiro-network:
    name: duzepesqueiro-network
    driver: bridge
